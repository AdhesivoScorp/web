
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adhesivo'S</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
    }

    header {
      background-color: #c62828;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 100%;
    }

    .section {
      margin-bottom: 30px;
      background-color: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h2 {
      color: #c62828;
    }

    .catalogo {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .producto {
      width: 100%;
      max-width: 300px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      background-color: #fff;
    }

    .producto img {
      width: 100%;
      height: auto;
      display: block;
    }

    .producto h3 {
      margin: 10px;
      font-size: 1.2em;
      color: #333;
    }

    .producto p {
      margin: 10px;
      font-size: 0.9em;
      color: #666;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 10px 15px;
      background-color: #c62828;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      text-align: center;
    }

    @media screen and (max-width: 600px) {
      .producto {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Bienvenidos a Adhesivo'S</h1>
  </header>

  <div class="container">
    <section class="section">
      <h2>Catálogo de Productos</h2>
      <div class="catalogo">
        <div class="producto">
          <img src="https://via.placeholder.com/300x200" alt="Cinta ejemplo">
          <h3>Cinta Ducto</h3>
          <p>Alta resistencia, ideal para reparaciones.</p>
          <a class="btn" href="#">+ Info</a>
        </div>
        <div class="producto">
          <img src="https://via.placeholder.com/300x200" alt="Cinta ejemplo">
          <h3>Cinta Kinesiológica</h3>
          <p>Apoyo muscular y recuperación deportiva.</p>
          <a class="btn" href="#">+ Info</a>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Contáctanos</h2>
      <p>WhatsApp: 5619025655</p>
      <p>Facebook: Adhesivo'S</p>
    </section>
  </div>
</body>
</html>
